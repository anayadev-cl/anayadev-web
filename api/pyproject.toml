[project]
name = "anayadev-api"
version = "0.1.0"
description = "API de anayadev-web: contenido público del sitio + CMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
